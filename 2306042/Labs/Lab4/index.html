
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Great Auto Parts - Order Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Great Auto Parts - Order Form</h1>

    <form>

        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" placeholder="Enter your first name">

        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" placeholder="Enter your last name">

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email address">

        <label for="phone">Phone number:</label>
        <input type="tel" id="phone" placeholder="Enter your phone number">

        <label for="make">Make:</label>
        <input type="text" id="make" placeholder="Make">

        <label for="model">Model:</label>
        <input type="text" id="model" placeholder="Model">

        <label for="year">Year:</label>
        <input type="number" id="year" placeholder="Year">

        <label for="date">Date:</label>
        <input type="date" id="date">

        <label for="part">Spare Part:</label>
        <input type="text" id="part" placeholder="Enter the spare part you need">

        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" placeholder="Enter the quantity of the spare part you need">

        <label for="comment">Comment:</label>
        <textarea id="comment" placeholder="Enter your comment"></textarea>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
