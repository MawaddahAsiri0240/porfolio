
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Player Stats Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>NBA Player Stats Dashboard</h1>

            <button id="dark-mode-toggle" type="button">
                Toggle Dark Mode
            </button>
        </header>

        <div class="table-filters">

            <input
                type="text"
                id="search"
                placeholder="Search players..."
                aria-label="Search players"
            >

            <select id="team-filter" aria-label="Filter by team">
                <option value="all">All</option>
            </select>

        </div>

        <table id="player-stats">

            <thead>
                <tr>
                    <th scope="col">Name</th>
                    <th scope="col">Team</th>
                    <th scope="col">Points</th>
                    <th scope="col">Rebounds</th>
                    <th scope="col">Assists</th>
                </tr>
            </thead>

            <tbody id="player-rows"></tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
